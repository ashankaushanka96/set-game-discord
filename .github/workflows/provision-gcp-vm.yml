name: Provision GCP VM

# Run manually (Actions → Provision GCP VM → Run workflow). Safe to re-run:
# an existing VM is reused and the setup script only changes what is missing.
on:
  workflow_dispatch:
    inputs:
      zone:
        description: 'Free-tier zone (us-central1-*, us-east1-*, us-west1-*)'
        required: true
        default: 'us-central1-a'

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      DEPLOY_USER: ashan
      SSH_OPTS: -i ~/.ssh/deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Prepare deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keygen -y -f ~/.ssh/deploy > ~/.ssh/deploy.pub

      - name: Create VM
        id: vm
        run: |
          ip=$(SSH_PUBKEY="$(cat ~/.ssh/deploy.pub)" ./deploy/gcp/create-vm.sh "${{ secrets.GCP_PROJECT_ID }}" "${{ inputs.zone }}" | tail -n 1)
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "VM IP: $ip"

      - name: Wait for SSH
        run: |
          for i in $(seq 1 30); do
            ssh $SSH_OPTS "$DEPLOY_USER@${{ steps.vm.outputs.ip }}" true && exit 0
            echo "SSH not ready yet ($i/30)"; sleep 10
          done
          echo "VM did not accept SSH in time" >&2; exit 1

      - name: Run setup script on VM
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          host="$DEPLOY_USER@${{ steps.vm.outputs.ip }}"
          # Secrets travel in a private file, not on a command line visible in `ps`
          umask 077
          {
            printf 'CLOUDFLARE_TUNNEL_TOKEN=%q\n' "$CLOUDFLARE_TUNNEL_TOKEN"
            printf 'DISCORD_CLIENT_ID=%q\n' "$DISCORD_CLIENT_ID"
            printf 'DISCORD_CLIENT_SECRET=%q\n' "$DISCORD_CLIENT_SECRET"
            printf 'DEPLOY_USER=%q\n' "$DEPLOY_USER"
            printf 'DEPLOY_PUBKEY=%q\n' "$(cat ~/.ssh/deploy.pub)"
          } > setup.env
          scp $SSH_OPTS setup.env deploy/gcp/setup-vm.sh "$host:"
          ssh $SSH_OPTS "$host" 'sudo bash -c "set -a; . ./setup.env; set +a; bash ./setup-vm.sh"; rc=$?; rm -f setup.env setup-vm.sh; exit $rc'
          rm -f setup.env

      - name: Summary
        run: |
          {
            echo "### VM ready: \`${{ steps.vm.outputs.ip }}\`"
            echo ""
            echo "1. Set the repository secret **HOST** to \`${{ steps.vm.outputs.ip }}\` (only needed if it changed)."
            echo "2. Run **Deploy Backend to GCP** (Actions → Run workflow) to install the app."
          } >> "$GITHUB_STEP_SUMMARY"
